name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      USE_VERSION: 7.5.0
      # SHA-256 of use-7.5.0-use-bin.zip, junit-4.13.2.jar and hamcrest-core-1.3.jar
      USE_ZIP_SHA256: 9b5a49d1d2345e65d1da8518008887e8bc12df388b6eef08228c5a1052618d10
      JUNIT_SHA256: 8e495b634469d64fb8acfa3495a065cbacc8a0fff55ce1e31007be4c16dc57d3
      HAMCREST_SHA256: 66fdef91e9739348df7a096aa384a5685f4e875584cce89386a7a47251c4d8e9
      # JaCoCo version, and SHA-256 of its agent (runtime) and CLI (nodeps) jars
      JACOCO_VERSION: 0.8.12
      JACOCO_AGENT_SHA256: 115e8e6e6593ca3a9892dfef695df4d487c706e59e71e64dc0ab95716ee02622
      JACOCO_CLI_SHA256: 594c01125b84864a7fc5a9efab19b71b7de36b27346863f6d7cd0cd45400ceb0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore USE binary release
        id: use-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/use
          key: use-${{ env.USE_VERSION }}-bin

      - name: Download USE binary release
        if: steps.use-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${USE_VERSION}" --repo useocl/use \
            --pattern "use-${USE_VERSION}-use-bin.zip" --dir "$RUNNER_TEMP"
          echo "${USE_ZIP_SHA256}  ${RUNNER_TEMP}/use-${USE_VERSION}-use-bin.zip" | sha256sum --check
          unzip -q "${RUNNER_TEMP}/use-${USE_VERSION}-use-bin.zip" -d "${RUNNER_TEMP}/use"

      - name: Download JUnit
        run: |
          mkdir -p "${RUNNER_TEMP}/junit"
          cd "${RUNNER_TEMP}/junit"
          curl -fsSLO --retry 5 --retry-delay 10 --retry-all-errors https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fsSLO --retry 5 --retry-delay 10 --retry-all-errors https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          echo "${JUNIT_SHA256}  junit-4.13.2.jar" | sha256sum --check
          echo "${HAMCREST_SHA256}  hamcrest-core-1.3.jar" | sha256sum --check

      - name: Download JaCoCo
        run: |
          mkdir -p "${RUNNER_TEMP}/jacoco"
          cd "${RUNNER_TEMP}/jacoco"
          base=https://repo1.maven.org/maven2/org/jacoco
          curl -fsSLO --retry 5 --retry-delay 10 --retry-all-errors "${base}/org.jacoco.agent/${JACOCO_VERSION}/org.jacoco.agent-${JACOCO_VERSION}-runtime.jar"
          curl -fsSLO --retry 5 --retry-delay 10 --retry-all-errors "${base}/org.jacoco.cli/${JACOCO_VERSION}/org.jacoco.cli-${JACOCO_VERSION}-nodeps.jar"
          echo "${JACOCO_AGENT_SHA256}  org.jacoco.agent-${JACOCO_VERSION}-runtime.jar" | sha256sum --check
          echo "${JACOCO_CLI_SHA256}  org.jacoco.cli-${JACOCO_VERSION}-nodeps.jar" | sha256sum --check

      - name: Build plugins and run JUnit
        run: ci/build-and-test.sh "${RUNNER_TEMP}/use" "${RUNNER_TEMP}/junit" "${RUNNER_TEMP}/out" "${RUNNER_TEMP}/jacoco"

      - name: Upload plugin jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: |
            ${{ runner.temp }}/out/ModelValidatorPlugin.jar
            ${{ runner.temp }}/out/use-filmstrip.jar

      # Also when the tests fail; nothing is uploaded if the report was not written.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ runner.temp }}/out/coverage
          if-no-files-found: ignore
